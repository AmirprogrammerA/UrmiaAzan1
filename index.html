<!-- بســم الـله الـرحمن الرحیــم -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="اوقات شرعی و تایمر اذان ارومیه">
    <title>اوقات شرعی ارومیه</title>
    
    <style>
        /* CSS - استایل‌های ظاهری */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .main-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        /* استایل تایمر معکوس */
        .timer-box {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .timer-box h3 {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        #countdown-timer {
            font-size: 2.2rem;
            font-weight: bold;
            margin-top: 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        /* استایل لیست اوقات شرعی */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }

        .item span {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 5px;
        }

        .item b {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        /* دکمه فعال‌سازی */
        #enable-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        #enable-btn:hover {
            background-color: #219150;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 400px) {
            .main-card { padding: 20px; }
            #countdown-timer { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>اوقات شرعی ارومیه</h2>
        
        <!-- دکمه برای گرفتن اجازه از کاربر برای نوتیفیکیشن و صدا -->
        <button id="enable-btn">🔔 فعال‌سازی اعلان و اذان</button>

        <!-- بخش تایمر معکوس -->
        <div class="timer-box">
            <h3>مانده تا اذان بعدی:</h3>
            <div id="countdown-timer">00:00:00</div>
        </div>

        <!-- لیست اوقات شرعی با IDهای مورد نظر -->
        <div class="grid-container">
            <div class="item"><span>صبح</span><b id="sobh">-</b></div>
            <div class="item"><span>ظهر</span><b id="zohr">-</b></div>
            <div class="item"><span>عصر</span><b id="asrr">-</b></div>
            <div class="item"><span>مغرب</span><b id="magreb">-</b></div>
            <div class="item"><span>عشا</span><b id="esha">-</b></div>
        </div>
    </div>

    <script>
        /* JAVASCRIPT - منطق برنامه */

        // تنظیم اوقات شرعی (این مقادیر باید روزانه آپدیت شوند یا از API گرفته شوند)
        const prayerTimes = {
            sobh: "04:31",
            zohr: "12:29",
            asrr: "16:08",
            magreb: "19:16",
            esha: "20:30"
        };

        // فایل صوتی اذان
        const azanAudio = new Audio('azan.mp4');
        let hasPlayedToday = false;

        // دریافت المنت‌ها
        const enableBtn = document.getElementById('enable-btn');
        const countdownElement = document.getElementById('countdown-timer');

        // ۱. فعال‌سازی اعلان و بارگذاری صدا
        enableBtn.addEventListener('click', () => {
            // درخواست اجازه نوتیفیکیشن سیستمی
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("اعلان‌ها فعال شدند. در صورت باز بودن صفحه، هنگام اذان هشدار دریافت خواهید کرد.");
                } else {
                    alert("لطفاً اجازه نوتیفیکیشن را در تنظیمات مرورگر فعال کنید.");
                }
            });

            // بارگذاری صدا برای جلوگیری از بلاک شدن توسط مرورگر
            azanAudio.load();
            enableBtn.innerText = "✅ سیستم آماده است";
            enableBtn.style.backgroundColor = "#7f8c8d";
            enableBtn.disabled = true;
        });

        // ۲. تابع اصلی آپدیت صفحه و بررسی زمان
        function updateDashboard() {
            const now = new Date();
            const currentHour = now.getHours().toString().padStart(2, '0');
            const currentMinute = now.getMinutes().toString().padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMinute}`;

            // نمایش زمان‌ها در UI
            Object.keys(prayerTimes).forEach(key => {
                document.getElementById(key).innerText = prayerTimes[key];

                // بررسی تطابق زمان فعلی با زمان اذان
                if (prayerTimes[key] === currentTimeStr && !hasPlayedToday) {
                    triggerAzan(key);
                }
            });

            // ریست کردن وضعیت پخش برای روز بعد (ساعت ۱۲ شب)
            if (currentTimeStr === "00:00") {
                hasPlayedToday = false;
            }

            // محاسبه و نمایش تایمر معکوس
            calculateCountdown(now);
        }

        // ۳. تابع پخش اذان و ارسال نوتیفیکیشن
        function triggerAzan(name) {
            hasPlayedToday = true;
            
            // پخش صدا
            azanAudio.play().catch(error => {
                console.log("پخش خودکار صدا توسط مرورگر بلاک شد. کاربر باید ابتدا روی صفحه کلیک کند.", error);
            });

            // ارسال نوتیفیکیشن سیستمی
            if (Notification.permission === "granted") {
                new Notification("وقت اذان است", {
                    body: `هم‌اکنون وقت اذان ${name} می‌باشد.`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/2800/2800889.png'
                });
            }
        }

        // ۴. تابع محاسبه تایمر معکوس
        function calculateCountdown(now) {
            let nextPrayerTime = null;

            // پیدا کردن اولین اذانی که در آینده است
            for (const key in prayerTimes) {
                const [h, m] = prayerTimes[key].split(':');
                const pDate = new Date();
                pDate.setHours(h, m, 0, 0);

                if (pDate > now) {
                    nextPrayerTime = pDate;
                    break;
                }
            }

            // اگر امروز تمام شد، اولین اذان فردا را نشان بده
            if (!nextPrayerTime) {
                const [h, m] = prayerTimes.sobh.split(':');
                nextPrayerTime = new Date();
                nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
                nextPrayerTime.setHours(h, m, 0, 0);
            }

            const diff = nextPrayerTime - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);

            countdownElement.innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // شروع کار برنامه
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
