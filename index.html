<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اوقات شرعی ارومیه</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        .time-item { margin: 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        #timer { font-size: 1.5rem; font-weight: bold; color: #d35400; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>اوقات شرعی ارومیه</h2>
        <div id="timer">در حال بارگذاری...</div>
        <div id="times-list">
            <div class="time-item">صبح: <span id="sobh">...</span></div>
            <div class="time-item">ظهر: <span id="zohr">...</span></div>
            <div class="time-item">عصر: <span id="asrr">...</span></div>
            <div class="time-item">مغرب: <span id="magreb">...</span></div>
            <div class="time-item">عشا: <span id="esha">...</span></div>
        </div>
    </div>

    <script>
        // تعریف داده‌ها با var برای سازگاری کامل
        var prayerTimes = {
            sobh: "04:31",
            zohr: "12:29",
            asrr: "16:08",
            magreb: "19:16",
            esha: "20:30"
        };

        function updateUI() {
            var now = new Date();
            
            // ۱. نمایش زمان‌ها
            for (var key in prayerTimes) {
                var el = document.getElementById(key);
                if (el) {
                    el.innerHTML = prayerTimes[key];
                }
            }

            // ۲. محاسبه زمان باقی‌مانده
            var nextTime = null;
            for (var key in prayerTimes) {
                var timeParts = prayerTimes[key].split(':');
                var pDate = new Date();
                pDate.setHours(parseInt(timeParts[0]), parseInt(timeParts[1]), 0, 0);

                if (pDate > now) {
                    nextTime = pDate;
                    break;
                }
            }

            if (nextTime) {
                var diff = nextTime - now;
                var h = Math.floor(diff / 3600000);
                var m = Math.floor((diff % 3600000) / 60000);
                var s = Math.floor((diff % 60000) / 1000);
                
                // فرمت کردن دستی اعداد (بدون استفاده از متدهای مدرن)
                var hStr = h < 10 ? "0" + h : h;
                var mStr = m < 10 ? "0" + m : m;
                var sStr = s < 10 ? "0" + s : s;
                
                document.getElementById('timer').innerHTML = "مانده: " + hStr + ":" + mStr + ":" + sStr;
            } else {
                document.getElementById('timer').innerHTML = "اوقات امروز تمام شد";
            }
        }

        // اجرای تابع هر ۱ ثانیه
        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
